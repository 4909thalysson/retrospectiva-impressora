<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Retrospectiva TI · Chamados</title>
  <meta name="description" content="Retrospectiva dos chamados concluídos pelo GI · TI">
  <meta name="theme-color" content="#0b0d12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="app">
    <section class="frame" id="frame" aria-label="Retrospectiva dos chamados de TI">
      <div class="progress" id="progress" aria-hidden="true"></div>

      <header class="topbar">
        <span class="brand"><i></i>GI · TI</span>
        <span class="tools">
          <a class="icon-btn" href="setores.html" aria-label="Abrir retrospectivas por setor" title="Retrospectivas por setor">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="5" rx="1"/><rect x="13" y="10" width="8" height="11" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/></svg>
          </a>
          <button class="icon-btn" id="btnPause" type="button" aria-label="Pausar">
            <svg viewBox="0 0 24 24" width="18" height="18"><path id="pauseIcon" fill="currentColor" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          </button>
          <button class="icon-btn" id="btnDownloadTop" type="button" aria-label="Baixar imagem do resumo">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>
          </button>
          <button class="icon-btn" id="btnShareTop" type="button" aria-label="Gerar e compartilhar vídeo">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg>
          </button>
        </span>
      </header>

      <div class="stage" id="stage"></div>

      <button class="zone zone-prev" id="zonePrev" type="button" aria-label="Slide anterior"></button>
      <button class="zone zone-next" id="zoneNext" type="button" aria-label="Próximo slide"></button>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="video-export.js"></script>
  <script src="dados/dados.js"></script>
  <script src="index.js"></script>
</body>
</html>
